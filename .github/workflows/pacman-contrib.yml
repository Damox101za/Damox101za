name: Pac-Man Contribution Graph

on:
  schedule:
    - cron: "30 18 * * *"   # Runs daily at 18:30 UTC
  workflow_dispatch:         # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate Pac-Man Contribution Graph
    timeout-minutes: 20

    permissions:
      contents: write        # Required to push the generated SVGs to the output branch

    steps:
      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
