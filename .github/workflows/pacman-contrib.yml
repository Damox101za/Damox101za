name: Pac-Man Contribution Graph

# Switched off: the Pac-Man section is hidden in the README.
# To turn it back on, restore the schedule and push triggers:
#   schedule:
#     - cron: "30 18 * * *"   # Runs daily at 18:30 UTC
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:         # Manual runs only, from the GitHub Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate Pac-Man Contribution Graph
    timeout-minutes: 20

    permissions:
      contents: write        # Required to push the generated SVGs to the output branch

    steps:
      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      - name: Check out repo for the smoothing script
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Smooth out animation timing
        run: python3 repo/.github/scripts/smooth_pacman.py dist/*.svg

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
