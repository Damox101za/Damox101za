name: GitHub 3D Contribution Graph

# Switched off: the 3D graph was replaced by the kaiju graph in the README.
# To turn it back on, restore the schedule and push triggers:
#   schedule:
#     - cron: "0 18 * * *"   # Runs daily at 18:00 UTC
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:         # Manual runs only, from the GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph

    permissions:
      contents: write        # Required to push the generated SVG back to the repo

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Damox101za

      - name: Commit & Push output
        run: |
          git config user.email "damox101za@gmail.com"
          git config user.name "Damox101za"
          git add -A
          git commit -m "chore: update 3D contribution graph" || true
          git push

